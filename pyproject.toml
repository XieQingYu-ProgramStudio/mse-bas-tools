[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yuexing-bas-toolbox"
version = "1.2.1"
description = "月星BAS工具箱：macOS TCC 权限诊断、动态授权与恢复"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "谢清宇@谢清宇工作室" },
]
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.7,<7"]

[project.scripts]
yuexing-bas = "tcc_permission_assistant.cli:main"
yuexing-bas-gui = "tcc_permission_assistant.app:main"
tcc-assistant = "tcc_permission_assistant.cli:main"
tcc-permission-assistant = "tcc_permission_assistant.cli:main"
tcc-assistant-gui = "tcc_permission_assistant.app:main"

[tool.setuptools.packages.find]
include = ["tcc_permission_assistant*"]

[tool.setuptools.package-data]
tcc_permission_assistant = [
  "gui/icons/*.svg",
  "gui/icons/LICENSE",
  "gui/assets/*.png",
]

[tool.ruff.lint.per-file-ignores]
"tcc_permission_assistant/gui/*.py" = ["BLE001"]

